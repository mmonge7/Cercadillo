name: Escaneo de secretos

# Revisa cada Pull Request y cada push a main/develop en busca de
# claves, contraseñas o tokens subidos por error, antes de que
# lleguen a producción.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
